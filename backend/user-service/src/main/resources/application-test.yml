spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/autoMarketTest}
    username: ${DB_USERNAME:test}
    password: ${DB_PASSWORD:test123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:test123}
      timeout: ${REDIS_TIMEOUT:2000}

jwt:
  access-secret: ${ACCESS_SECRET_KEY:access-secret-test}
  refresh-secret: ${REFRESH_SECRET_KEY:refresh-secret-test}
  access-expiration: ${ACCESS_EXPIRATION:15m}
  refresh-expiration: ${REFRESH_EXPIRATION:7d}

amazon:
  endpoint: ${AMAZON_ENDPOINT:http://localhost:9000}
  access-key: ${AMAZON_ACCESS_KEY:minioadmin}
  secret-key: ${AMAZON_SECRET_KEY:minioadmin123}
  bucket: ${AMAZON_BUCKET:test-bucket}

password:
  reset:
    frontend-url: "https://frontend.app/reset-password"
    token-ttl-minutes: 15