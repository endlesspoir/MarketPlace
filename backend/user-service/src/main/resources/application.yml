spring:
  application:
    name: user-service
  profiles:
    active: test


  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

server:
  port: 8080

logging:
  level:
    root: INFO
    com.marketplace.userservice: DEBUG